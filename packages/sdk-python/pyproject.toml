[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doubleoh"
version = "0.1.3"
description = "The authority layer for AI agents: when an agent is stuck, a person fixes it once and the fix becomes a bounded skill."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["doubleoh"]
